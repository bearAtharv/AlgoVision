<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Algorithm Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-screen">
        <div class="loader-bars"></div>
        <p class="loader-text">Decompiling legacy code...</p>
    </div>

    <div class="main-container">
        <div id="sidebar">
            <h2>Algorithms</h2>
            <ul id="algorithm-list"></ul>
        </div>
        <div class="main-content">
            <div class="top-controls">
                <div id="language-selector">
                    <button class="lang-btn active" data-lang="javascript">JavaScript</button>
                    <button class="lang-btn" data-lang="python">Python</button>
                    <button class="lang-btn" data-lang="cpp">C++</button>
                </div>
                <div id="view-selector">
                    <button class="view-btn active" data-view="bars"><i class="fas fa-chart-bar"></i> Bars</button>
                    <button class="view-btn" data-view="array"><i class="fas fa-grip-horizontal"></i> Array</button>
                </div>
            </div>
            <div id="code-container">
                <div class="code-header">Code</div>
                <pre><code id="code-block" class="language-javascript"></code></pre>
            </div>
            <div id="visualization-container"></div>
            <div id="controls">
                <div class="playback-controls">
                    <button id="play-btn"><i class="fas fa-play"></i> Play</button>
                    <button id="pause-btn"><i class="fas fa-pause"></i> Pause</button>
                    <button id="reset-btn"><i class="fas fa-sync-alt"></i> Reset</button>
                </div>
                <div class="speed-control">
                    <label for="speed-slider">Speed</label>
                    <input type="range" id="speed-slider" min="5" max="60" value="30">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
